# Usage:
#   1. Put your corporate certificate + key at nginx/certs/fullchain.pem and
#      nginx/certs/privkey.pem (see nginx/certs/README.md).
#   2. Optionally set SERVER_NAME (below) to your real hostname.
#   3. docker compose up -d
#
# nginx runs INSIDE this container alongside the app (see server/Dockerfile
# and server/supervisord.conf) and terminates TLS on 443. No separate nginx
# container or host nginx config is needed.

services:
  mcp:
    build:
      context: ./server
    image: cognigy-mcp:latest
    restart: unless-stopped
    environment:
      # nginx server_name; "_" (default) matches any hostname, which is fine
      # for an IP-only or single-purpose host. Set this to your real FQDN if
      # you want nginx to reject requests for other hostnames.
      - SERVER_NAME=${SERVER_NAME:-_}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
