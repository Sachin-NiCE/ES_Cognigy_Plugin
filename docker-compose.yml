# Usage:
#   docker compose up -d
#
# Starts the MCP server bound to 127.0.0.1:8000 on the host. Put your
# existing nginx (or other reverse proxy) in front of it - see
# nginx/cognigy-mcp.conf for a drop-in config snippet using your
# corporate TLS certificates.

services:
  mcp:
    build:
      context: ./server
    image: cognigy-mcp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
