# Drop-in nginx config for reverse-proxying to the Cognigy MCP server
# container (docker-compose.yml exposes it at 127.0.0.1:8000).
#
# You already have nginx and corporate TLS certificates on this host, so use
# WHICHEVER of the two blocks below fits your existing setup:

# ---------------------------------------------------------------------------
# OPTION A: you already have a `server { listen 443 ssl; ... }` block for
# this host/domain (corporate certs already referenced there). Just add this
# `location` block inside it, then `sudo nginx -t && sudo systemctl reload nginx`.
# ---------------------------------------------------------------------------
#
#   location /mcp {
#       proxy_pass http://127.0.0.1:8000/mcp;
#       proxy_http_version 1.1;
#
#       # Streamable HTTP can hold a connection open for server-sent events;
#       # don't let nginx's defaults cut that off or buffer it.
#       proxy_set_header Connection "";
#       proxy_buffering off;
#       proxy_read_timeout 3600s;
#
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }

# ---------------------------------------------------------------------------
# OPTION B: this is a fresh site/server block dedicated to the MCP server.
# Copy this file to your nginx sites directory (e.g.
# /etc/nginx/conf.d/cognigy-mcp.conf or /etc/nginx/sites-available/ +
# symlink into sites-enabled), fill in server_name and your corporate
# certificate paths, then `sudo nginx -t && sudo systemctl reload nginx`.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name cognigy-mcp.your-corp-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cognigy-mcp.your-corp-domain.example;

    # Replace with your corporate certificate/key paths.
    ssl_certificate     /etc/pki/tls/certs/your-corp-cert.pem;
    ssl_certificate_key /etc/pki/tls/private/your-corp-key.pem;
    # If your corporate CA issues an intermediate chain, either concatenate
    # it into ssl_certificate above, or add: ssl_trusted_certificate ...;

    # Cognigy API keys travel in request headers on every call - never allow
    # this proxy to fall back to plain HTTP, and don't log these headers
    # (nginx's default access log format doesn't include request headers,
    # so no change is needed unless you've customized log_format).
    location /mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
