; Runs both the MCP app (uvicorn, loopback-only) and nginx (public-facing TLS
; termination) inside the same container. Both are set to autorestart; check
; `docker logs` if one keeps failing (e.g. missing/invalid certs for nginx).
; The whole container runs as the non-root "mcp" user (see Dockerfile's
; `USER mcp`), so no per-program `user=` directive is needed here.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:uvicorn]
command=/usr/local/bin/uvicorn app:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
